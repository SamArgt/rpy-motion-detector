[camera]
device = /dev/video0

[detection]
min_area = 20000
max_area = 100000
var_threshold = 50
bin_threshold = 200
background_substractor_history = 500
blur_size = 21
dilate_iterations = 2
consecutive_frames = 3
exclude_zones = 10,20,100,80;200,150,300,250

[movie]
enable = true
device = /dev/video1
dirpath = tmp/movies
precapture_seconds = 5
max_duration = 60
record_precapture = false

[picture]
enable = true
dirpath = tmp/pictures

[event]
no_motion_timeout = 20
event_gap = 30
on_event_start = echo "start"
on_event_end = echo "end"
on_movie_start = echo "movie start"
on_movie_end = echo "movie end"
on_picture_save = echo "picture saved"

[log]
level = INFO

[tmp]
dirpath = tmp/
